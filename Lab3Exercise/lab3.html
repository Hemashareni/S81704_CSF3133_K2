<!DOCTYPE html>
<html lang="en">
    <meta charset="utf-8">
    <meta name="viewport" content=""width=device-width, initial-scale="1.0">
    <title>Interactive Contact Form and Calculator</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f4f9;
            color: #333;
        }
        .container{
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
   header, .content-section, footer {
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid #eee;
        }
        footer {
            border-bottom: none;
            text-align: center;
            font-size: 0.9em;
            color: #666;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="email"],
        input[type="date"],
        input[type="number"] {
            width: 100%;
            padding: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        input[type="range"] {
            width: 100%;
        }
        button {
            background-color: #20B2AA;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        output {
            font-weight: bold;
            color: #4169E1;
            font-size: 1.1em;
        }
    </style>
</head>
<body>

    <div class="container">
        
        <!--Header Section -->
        <header>
            <h1>Welcome to Our Portal <span style="font-size: 0.6em; color: #555; display: block; font-weight: normal;">Get in touch & compute easily</span></h1>
        </header>

        <!--Content Section -->
        <div class="content-section">
            
            <!-- Contact Form Sub-division -->
            <div>
                <h2>Contact Form</h2>
                <form action="#" method="POST">
                    <div class="form-group">
                        <label for="email">Email Address:</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email">
                    </div>

                    <div class="form-group">
                        <label for="contact-date">Preferred Contact Date:</label>
                        <input type="date" id="contact-date" name="contact_date" required>
                    </div>

                    <div class="form-group">
                        <label for="satisfaction">Satisfaction Level (Range 1-10):</label>
                        <input type="range" id="satisfaction" name="satisfaction" min="1" max="10" value="5" oninput="this.nextElementSibling.value = this.value">
                        <output>5</output>
                    </div>

                    <div class="form-group">
                        <button type="submit">Submit Inquiry</button>
                    </div>
                </form>
            </div>

            <hr style="border: 0; border-top: 1px dashed #ccc; margin: 20px 0;">

            <!-- Inline Calculator Sub-division -->
            <div>
                <h2>Inline Calculator</h2>
                <form oninput="result.value = Number(num1.value) + Number(num2.value)">
                    <div class="form-group">
                        <label for="num1">Number 1:</label>
                        <input type="number" id="num1" name="num1" value="0">
                    </div>

                    <div class="form-group">
                        <label for="num2">Number 2:</label>
                        <input type="number" id="num2" name="num2" value="0">
                    </div>

                    <div class="form-group">
                        <label>Sum Result:</label>
                        <output name="result" for="num1 num2">0</output>
                    </div>
                </form>
            </div>

        </div>

        <!--Footer Section -->
        <footer>
            <p>&copy; 2026 Web Development Lab. All rights reserved.</p>
        </footer>

    </div>

</body>
</html>

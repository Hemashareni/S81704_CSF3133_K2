<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock, Paper, Scissors</title>
  <!-- Link external CSS stylesheet -->
  <link rel="stylesheet" href="style1.css">
</head>
<body>
  <div class="container">
    <!-- Header section with title and instructions -->
    <header class="header">
      <h1>Rock, Paper, Scissors</h1>
      <p>Enter your name, click Start Game, then choose Rock, Paper or Scissors.</p>
    </header>

    <!-- Player section for entering name and starting the game -->
    <section class="player-section">
      <label for="playerName">Your name:</label>
      <input type="text" id="playerName" placeholder="Enter your name">
      <button type="button" onclick="startGame()">Start Game</button>
      <p id="welcomeMsg"></p>
    </section>

    <!-- Game section with choice buttons and choice images -->
    <section class="game-section">
      <div class="choice-buttons">
        <button type="button" onclick="playRound('rock')">Rock</button>
        <button type="button" onclick="playRound('paper')">Paper</button>
        <button type="button" onclick="playRound('scissors')">Scissors</button>
      </div>

      <div class="arena">
        <div class="choice-box">
          <h3>You</h3>
          <img id="playerImg" src="player.jpeg" alt="Your choice">
        </div>
        <div class="vs-text">VS</div>
        <div class="choice-box">
          <h3>Computer</h3>
          <img id="computerImg" src="computer.jpeg" alt="Computer choice">
        </div>
      </div>
    </section>

    <!-- Result and scoreboard section -->
    <section class="result-section">
      <p id="result"></p>
      <div class="scoreboard">
        Wins: <span id="wins">0</span> |
        Losses: <span id="losses">0</span> |
        Draws: <span id="draws">0</span>
      </div>
    </section>

    <!-- History table and control buttons -->
    <section class="history-section">
      <h2>History</h2>
      <table id="history">
        <thead>
          <tr>
            <th>Round</th>
            <th>You</th>
            <th>Computer</th>
            <th>Result</th>
          </tr>
        </thead>
        <tbody id="historyBody"></tbody>
      </table>

      <div class="action-buttons">
        <button type="button" onclick="showSummary()">Show Summary</button>
        <button type="button" onclick="resetGame()">Reset</button>
      </div>
      <p id="summary"></p>
    </section>

    <!-- Footer with start date/time and copyright -->
    <footer class="footer">
      <p id="startTime"></p>
      <p>&copy; 2026 Computer Science Club</p>
    </footer>
  </div>

  <!-- Link external JavaScript file -->
  <script src="game.js"></script>
</body>
</html>
